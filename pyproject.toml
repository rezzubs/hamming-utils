[project]
name = "faultforge"
version = "0.2.1"
description = "A framework for reproducible hardware fault-injection experiments on PyTorch models"
readme = "README.md"
authors = [
    { name = "Marten Roots", email = "marten.roots@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3.1",
    "pillow>=11.3.0",
    "pydantic>=2.12.3",
    "scipy>=1.17.1",
    "timm>=1.0.22",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Repository = "https://github.com/rezzubs/faultforge"
Issues = "https://github.com/rezzubs/faultforge/issues"
Changelog = "https://github.com/rezzubs/faultforge/blob/main/CHANGELOG.md"

[tool.uv.workspace]
members = ["experiments/encoded_memory", "experiments/systolic"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "hypothesis>=6.148.7",
    "maturin>=1.14.0",
    "pytest>=9.0.2",
    "ruff>=0.12.4",
    "ty>=0.0.49",
]

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "faultforge._rust"
manifest-path = "crates/bindings/Cargo.toml"
python-source = "src"

[tool.ty.rules]
missing-override-decorator = "warn"

[tool.ruff]
target-version = "py314"
