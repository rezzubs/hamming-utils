[package]
name = "logic_simulation"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
proptest = ["dep:proptest-derive", "dep:proptest"]

[dependencies]
thiserror.workspace = true
ariadne = "0.6"
chumsky = "0.13.0"
clap = { version = "4.6.1", features = ["derive"] }

proptest = { version = "1.11.0", optional = true }
proptest-derive = { version = "0.8.0", optional = true }

[dev-dependencies]
proptest = "1.11.0"
logic_simulation = { path = ".", features = ["proptest"] }
